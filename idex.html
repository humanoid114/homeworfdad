
<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delicious Apples - Product Card</title>
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    
  
      <div class="top-icons">
        <i class="fa-solid fa-share-nodes"></i>
        <i class="fa-regular fa-heart"></i>
      
     
      <img src="https://www.istockphoto.com/photos/green-apple-on-white" alt="Delicious Green Apple" class="main-apple">

      
      <div class="thumbnails">
        <div class="thumb active">
          <img src="https://www.istockphoto.com/photos/green-apple-cut-on-white" alt="apple 1">
        </div>
        <div class="thumb">
          <img src="https://www.istockphoto.com/photos/green-apple-cut-on-white 2">
        </div>
        <div class="thumb">
          <img src="https://www.istockphoto.com/photos/green-apple-cut-on-white" alt="apple 3">
        </div>
        <div class="thumb">
          <img src="https://www.istockphoto.com/photos/green-apple-cut-on-white" alt="apple 4">
        </div>
      </div>
    </div>

    <div>
    <div class="product-details">
      <h1 class="title">Delicious Apples</h1>
      <span class="cod">COD: 45999</span>

      <div class="price">
        <span class="currency">R$</span>
        <span class="amount">7.93</span>
      </div>

      
      <div class="section-title">green</div>
      <div class="color-options">
        <div class="color-box active">
          <span class="dot green"></span>
        </div>
        <div class="color-box">
          <span class="dot yellow"></span>
        </div>
        <div class="color-box">
          <span class="dot orange"></span>
        </div>
        <div class="color-box">
          <span class="dot red"></span>
        </div>
      </div>

      <div class="section-title">BENEFITS</div>
      <ul class="benefits-list">
        <li>Apples are nutritious</li>
        <li>Apples may be good for weight loss</li>
        <li>Apples may be good for bone health</li>
        <li>They're linked to a lowest risk of diabetes</li>
      </ul>

     
      <button class="add-to-cart-btn">ADD TO CART</button>
    </div>

  </div>

</body>
</html>
